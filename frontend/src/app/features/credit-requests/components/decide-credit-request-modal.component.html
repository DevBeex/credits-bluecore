<ion-modal [isOpen]="isOpen()" (didDismiss)="onDismiss()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ title() }}</ion-title>
        <ion-buttons slot="end">
          <app-button
            variant="icon"
            type="button"
            ariaLabel="Cerrar"
            (click)="closed.emit()"
          >
            <ion-icon name="close-outline"></ion-icon>
          </app-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      @if (request(); as item) {
        <div class="summary">
          <p><strong>{{ item.applicantDocument }}</strong></p>
          <p>
            {{ amountNumber(item.amount) | currency: 'USD' : 'symbol' : '1.2-2' }}
            · {{ item.termMonths }} meses
          </p>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <ion-item>
            <ion-textarea
              label="Comentario"
              labelPlacement="stacked"
              placeholder="Escribe el motivo de la decisión"
              [autoGrow]="true"
              [counter]="true"
              [maxlength]="commentMax"
              formControlName="comment"
            ></ion-textarea>
          </ion-item>
          <app-field-error
            [control]="form.controls.comment"
            [messages]="commentMessages"
            [submitted]="submitted()"
          />
        </div>

        <app-button
          type="submit"
          expand="block"
          [variant]="action() === 'APPROVED' ? 'primary' : 'danger'"
          [disabled]="form.invalid || submitting() || !form.controls.comment.value.trim()"
        >
          {{ submitting() ? 'Guardando…' : submitLabel() }}
        </app-button>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
