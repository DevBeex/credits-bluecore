<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-container login-card">
    <h1>Solicitudes de crédito</h1>
    <p>Usa el usuario de demostración para entrar.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list>
        <ion-item>
          <ion-input
            label="Correo"
            labelPlacement="stacked"
            type="email"
            formControlName="email"
            autocomplete="username"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="stacked"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          ></ion-input>
        </ion-item>
      </ion-list>

      @if (errorMessage(); as message) {
        <ion-note color="danger">{{ message }}</ion-note>
      }

      <ion-button
        expand="block"
        type="submit"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </ion-button>
    </form>
  </div>
</ion-content>
